<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6"/>
      <stop offset="45%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#8F7249"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1C1A"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Sleek Luxury Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#C5A880" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Central Big Star (4-point sparkle) -->
  <path d="M29 11 C29 21.5 21.5 29 11 29 C21.5 29 29 36.5 29 47 C29 36.5 36.5 29 47 29 C36.5 29 29 21.5 29 11 Z" fill="url(#goldGrad)" filter="url(#softGlow)"/>

  <!-- Little Star 1 (Top Right) -->
  <path d="M48 10 C48 15 44.5 18.5 39.5 18.5 C44.5 18.5 48 22 48 27 C48 22 51.5 18.5 56.5 18.5 C51.5 18.5 48 15 48 10 Z" fill="url(#goldGrad)"/>

  <!-- Little Star 2 (Bottom Left) -->
  <path d="M16 40 C16 43.8 13.2 46.5 9.5 46.5 C13.2 46.5 16 49.2 16 53 C16 49.2 18.8 46.5 22.5 46.5 C18.8 46.5 16 43.8 16 40 Z" fill="url(#goldGrad)"/>
</svg>